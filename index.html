<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F2F3; --ink:#4A2F3A; --soft:#917581;
  --line:#F3BFD0; --hover:#F7CCDA; --blossom:#D9788F; --card:#FBDCE6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#241820; --ink:#F7E6EC; --soft:#B99AA7;
    --line:#6A4457; --hover:#5A3547; --blossom:#E58EA6; --card:#4A2B3A;
  }
}
:root[data-theme="dark"]{
  --bg:#241820; --ink:#F7E6EC; --soft:#B99AA7;
  --line:#6A4457; --hover:#5A3547; --blossom:#E58EA6; --card:#4A2B3A;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'DM Sans',system-ui,sans-serif;font-size:1rem;line-height:1.5;
  display:flex;justify-content:center;padding:0 16px;
}
main{
  width:100%;max-width:400px;margin:56px 0;align-self:flex-start;
  padding:44px 28px 64px;text-align:center;
  background:var(--frame);border-radius:28px;
}
.avatar{
  width:128px;height:128px;margin:0 auto 24px;border-radius:50%;
  background:var(--hover);border:1px solid var(--line);color:var(--blossom);
  display:grid;place-items:center;font-size:2.4rem;font-weight:600;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
h1{
  font-weight:600;font-size:1.75rem;line-height:1.2;margin:0 0 8px;letter-spacing:-.01em;
}
.bio{margin:0 auto 44px;max-width:32ch;color:var(--soft)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.link{
  display:block;padding:16px 24px;border-radius:9999px;background:var(--card);overflow:hidden;-webkit-tap-highlight-color:transparent;
  border:0;color:var(--ink);text-decoration:none;
  font-weight:500;transition:background .2s ease,border-color .2s ease;
}
a.link:hover{background:var(--hover);border-color:var(--blossom)}
a.link.primary{
  background:#CF4A74;border-color:#CF4A74;color:#FFFFFF;font-weight:600;padding:19px 24px;
}
a.link.primary:hover{background:#BC3E67;border-color:#BC3E67}
a.link:focus-visible{outline:2px solid var(--blossom);outline-offset:3px}
:root{--frame:#FFFFFF;--frame-line:#F3DDE5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--frame:#2C1D26;--frame-line:#4A3341}}
:root[data-theme="dark"]{--frame:#2C1D26;--frame-line:#4A3341}
@media (prefers-reduced-motion:reduce){a.link{transition:none}}
</style>
